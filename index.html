<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    
    <!-- 🔒 Security Headers (Note: X-Frame-Options only works via HTTP headers) -->
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Referrer-Policy" content="strict-origin-when-cross-origin" />
    
    <!-- 🔒 Content Security Policy (Development - permissive for HMR & localhost) -->
    <!-- In production, backend will send stricter CSP headers -->
    <meta http-equiv="Content-Security-Policy" content="
      default-src 'self';
      script-src 'self' 'unsafe-inline' 'unsafe-eval' https://www.google.com https://www.gstatic.com https://recaptcha.google.com;
      style-src 'self' 'unsafe-inline' https://www.google.com https://www.gstatic.com;
      img-src 'self' data: https: blob:;
      font-src 'self' data:;
      connect-src 'self' http://localhost:* ws://localhost:* wss://localhost:* ws: wss: https://*.googleapis.com https://*.firebaseio.com https://*.onrender.com https://www.google.com https://recaptcha.google.com;
      frame-src 'self' https://www.google.com https://recaptcha.google.com https://www.recaptcha.net;
      child-src 'self' https://www.google.com https://recaptcha.google.com;
      base-uri 'self';
      form-action 'self';
    " />
    
    <title>Frontend Development Platform MVP</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
